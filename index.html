<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mobile2 Global Pazar: Metin2 item ve efsun ilanlarını ara, ilan ver, satıcıyla iletişime geç.">
<meta name="theme-color" content="#14100d">
<script src="theme.js?v=4"></script>
<meta property="og:title" content="Mobile2 Global Pazar">
<meta property="og:description" content="Mobile2 Global item, efsun ve yang ilanları. Sunucuna göre ara, ilan ver.">
<meta property="og:type" content="website">
<title>Mobile2 Global Pazar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="theme.css?v=4">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span id="brandTxt">⚔️ Mobile2 Pazar</span><small id="brandSub">Item ve efsun ilanları</small></div>
  <div class="hdr-r">
    <button class="btn icon" id="themeBtn" type="button" aria-label="Tema değiştir"></button>
    <div id="authBar"></div>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroH">Aradığın efsunlu itemi bul.</h1>
    <p id="heroP">İtem adına, efsuna, artıya ve fiyata göre ara. İlanlar yayında kalır.</p>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabItems" aria-selected="true">⚔️ İtem</button>
    <button class="tab" role="tab" id="tabYang" aria-selected="false">💰 Yang</button>
    <button class="tab" role="tab" id="tabFeat" aria-selected="false">⭐ Öne Çıkanlar</button>
    <button class="tab" role="tab" id="tabPrem" aria-selected="false">💎 Premium</button>
    <button class="tab hide" role="tab" id="tabMine" aria-selected="false">İlanlarım</button>
    <button class="tab hide" role="tab" id="tabAdmin" aria-selected="false">🛡️ Yönetim Paneli</button>
  </div>

  <div class="filters" id="fItems">
    <div class="full"><label for="fName">İtem Adı</label><input id="fName" placeholder="Örn: Zehir Kılıcı" autocomplete="off"></div>
    <div class="full"><label for="fEfsun">Efsun</label><input id="fEfsun" placeholder="Örn: Kılıç Savunması" autocomplete="off"></div>
    <div><label for="fCat">Kategori</label><select id="fCat"></select></div>
    <div><label for="fPlus">Artı</label><select id="fPlus"><option value="">Hepsi</option></select></div>
    <div><label for="fSrv">Sunucu</label><select id="fSrv"></select></div>
  </div>

  <div class="filters hide" id="fYang">
    <div><label for="fySrv">Sunucu</label><select id="fySrv"></select></div>
    <div><label for="fyUnit">Birim</label><select id="fyUnit"></select></div>
  </div>

  <div class="meta"><span id="count"></span><button class="btn sm" id="resetBtn">Filtreleri Temizle</button></div>
  
  <div id="list" class="grid"></div>
  <div style="text-align:center;margin-top:20px"><button class="btn hide" id="moreBtn">Daha Fazla Göster</button></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=4"></script>
</body>
</html>
